# Price-only research universes (Phase 5). Members get daily prices from the same
# collector as the watchlist (collectors/prices.py --universe NAME) and nothing else:
# no news, social, filings, indicators or dashboard entry. They are never part of
# run_update.py, so the daily watchlist update isn't slowed or rate-limited by them.

universes:
  nifty50_ex_watchlist:
    purpose: Out-of-sample test of docs/hypotheses.md H1 and H2 (gap signals only).
    source: >-
      Wikipedia "NIFTY 50" constituents table (list dated 2025-12-08), retrieved
      2026-09-24, minus the 5 watchlist stocks. Not checked against NSE's official list,
      which this project doesn't fetch (principle 7); later rebalances may be missing.
    # Demerger ex-dates Yahoo doesn't adjust for: gap events on these dates are excluded.
    known_demergers:
