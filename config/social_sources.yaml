# Social sources for collectors/valuepickr.py (Phase 4).
#
# ValuePickr (forum.valuepickr.com) runs Discourse. Checked 2026-09-24:
#   - Terms of Service (2018) have no bot/API clause; user contributions are licensed
#     CC BY-NC-SA 3.0, so this is for personal, non-commercial use only.
#   - robots.txt allows "*" except /search, /t/*/*.rss, /c/*.rss and account paths.
#     We only request /t/<id>.json, /t/<id>/posts.json and /latest.json, and the collector
#     re-checks robots.txt at the start of every run.
#   - Discourse's default limit is 50 requests per 10 s per IP; we make 1 every 5 s.

valuepickr:
  base_url: https://forum.valuepickr.com
  user_agent: "stock-intel/0.1 (personal non-commercial market research; python-httpx)"
  timeout_s: 20
  min_interval_s: 5         # seconds between any two requests
  max_retry_after_s: 300    # on HTTP 429, wait Retry-After once if it's at most this; else stop
  backfill_posts: 200       # first run per topic: only the newest this many posts
  discovered_backfill_posts: 20
  recheck_posts: 100        # stored posts re-checked per run for deletions and edits
  latest_max_topics: 5      # /latest.json topics fetched per run (titles naming a stock)

  # Set to true once the topic IDs below have been confirmed against the live forum.
  # Until then the collector makes no requests.
  confirmed: false

  # Dedicated topics: every post links to `symbol` with confidence 0.9. With
  # `default_until`, only posts created before that date default to the symbol; later
  # posts go through the entity linker (TMPV: from the demerger ex-date, bare "Tata
  # Motors" means the CV company unless there's passenger-vehicle context).
  # General topics (no symbol) always go through the entity linker.
  topics:
    - id: 24141
      title: "HDFC Bank - we understand your world"
      symbol: HDFCBANK
    - id: 32873
      title: "RIL: Is the 'Reliance' on 'Jio' Justified?"
      symbol: RELIANCE
    - id: 8124
      title: "Infosys Limited - Are we getting a discount or no?"
      symbol: INFY
    - id: 1233
      title: "Tata Motors - On the way to world Automobile leader?"
      symbol: TMPV
      default_until: 2025-10-14
    - id: 133414
      title: "Market news and updates"
