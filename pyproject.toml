[project]
name = "stock-intel"
version = "0.1.0"
description = "Personal stock intelligence tool for Indian markets (NSE/BSE)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "apscheduler>=3.11.3",
    "httpx>=0.28.1",
    "pandas>=3.0.6",
    "pandas-ta>=0.4.71b0",
    "plotly>=7.1.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.54",
    "streamlit>=1.64.0",
    "yfinance>=1.7.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DTZ"]  # DTZ flags naive datetimes (we store UTC)

[tool.pytest.ini_options]
testpaths = ["tests"]
